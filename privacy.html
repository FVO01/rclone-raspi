<h1>Norme sulla privacy</h1>
<p>Questa app è usata solo dal proprietario dell'account Google, per caricare backup cifrati su Google Drive con rclone.</p>
<p>L'app chiede solo l'accesso <code>drive.file</code>: vede soltanto i file che crea lei. Nessun dato viene raccolto, condiviso con terzi o usato per altri scopi.</p>
